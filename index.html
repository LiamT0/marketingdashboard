  <!-- GitHub Pages SPA routing fix: restore the original path after 404.html redirects to /?p=... -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          window.history.replaceState(null, '', decodeURIComponent(p));
        }
      } catch (e) {
        // no-op
      }
    })();
  </script>
